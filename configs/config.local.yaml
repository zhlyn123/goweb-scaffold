app:
  name: goweb-scaffokd
  env: local

http:
  addr: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  shutdown_timeout: 10s

log:
  level: debug
  format: console

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://localhost:8080"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
  expose_headers:
    - "X-Request-ID"
  allow_credentials: true
  max_age: 12h

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: goweb_scaffold
  ssl_mode: disable
  time_zone: Asia/Shanghai
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  connect_timeout: 5s

jwt:
  secret: "local-dev-secret-change-me"
  issuer: "goweb-scaffold"
  access_token_ttl: 2h
